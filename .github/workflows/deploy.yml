name: AWS Remote Auto Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SSH into AWS and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Enter the application directory on AWS
            cd /opt/app/mocknata || { echo "❌ App directory not found on AWS"; exit 1; }
            
            # 2. Pull the latest code using the token/SSH already on the server
            git stash
            git pull origin main
            
            # 3. Give permissions to the script inside the repo
            chmod +x .github/workflows/deploy.sh
            
            # 4. Run the deployment script
            ./.github/workflows/deploy.sh
